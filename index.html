<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missão Autonomia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
    body { font-family: 'Fredoka', sans-serif; background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); min-height: 100vh; }
    .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); }
  </style>
</head>
<body class="p-3 md:p-6 text-slate-800">
  <div class="max-w-4xl mx-auto space-y-4">
    
    <!-- Topo / Header -->
    <div class="bg-white rounded-3xl p-4 card-shadow flex flex-wrap items-center justify-between gap-3 border-2 border-amber-200">
      <div class="flex items-center gap-3">
        <div class="bg-amber-400 text-white p-3 rounded-2xl text-2xl shadow-sm">🚀</div>
        <div>
          <h1 class="text-xl md:text-2xl font-bold text-amber-600 leading-tight">Missão Autonomia</h1>
          <p class="text-xs text-slate-500 font-semibold">Transforme suas tarefas em Superpoderes!</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button id="btn-flavinho" onclick="switchChild('flavinho')" class="px-4 py-2 rounded-xl font-bold text-sm transition-all bg-amber-500 text-white shadow-md">
          🚀 Flavinho (9)
        </button>
        <button id="btn-carol" onclick="switchChild('carol')" class="px-4 py-2 rounded-xl font-bold text-sm transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
          🎸 Carol (11)
        </button>
        <button onclick="openParentModal()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-xl text-sm font-bold shadow-sm transition-all ml-1">
          🔐 Pais
        </button>
      </div>
    </div>

    <!-- Perfil da Criança -->
    <div class="bg-white rounded-3xl p-5 card-shadow border-2 border-amber-200 relative overflow-hidden">
      <div class="flex flex-col md:flex-row items-center gap-4">
        <div class="w-20 h-20 rounded-full bg-amber-100 border-4 border-amber-400 flex items-center justify-center text-4xl shadow-inner" id="profile-avatar">
          🚀
        </div>
        <div class="flex-1 text-center md:text-left space-y-1">
          <h2 class="text-2xl font-bold text-slate-800" id="profile-name">Flavinho</h2>
          <p class="text-xs font-semibold text-amber-600" id="profile-sub">Explorador da Autonomia (9 anos)</p>
          
          <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden border border-slate-200 mt-2">
            <div id="xp-bar" class="bg-gradient-to-r from-amber-400 to-orange-500 h-full transition-all duration-500" style="width: 0%"></div>
          </div>
          <div class="flex justify-between text-xs font-bold text-slate-400 pt-1">
            <span id="level-label">Nível 1</span>
            <span id="xp-text">0 / 100 XP</span>
          </div>
        </div>

        <div class="flex gap-3">
          <div class="bg-amber-50 border border-amber-200 rounded-2xl px-4 py-2 text-center">
            <div class="text-xs text-amber-600 font-bold">MOEDAS</div>
            <div class="text-xl font-bold text-amber-700 flex items-center justify-center gap-1">
              🪙 <span id="coins-count">0</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Navegação de Abas -->
    <div class="flex gap-2 border-b-2 border-amber-200 pb-2">
      <button id="tab-tasks" onclick="switchTab('tasks')" class="px-5 py-2.5 rounded-2xl font-bold text-sm bg-amber-500 text-white shadow-sm">
        📋 Minhas Missões
      </button>
      <button id="tab-store" onclick="switchTab('store')" class="px-5 py-2.5 rounded-2xl font-bold text-sm bg-white text-slate-600 hover:bg-slate-50 border border-slate-200">
        🏪 Loja de Prêmios
      </button>
    </div>

    <!-- Seção: Lista de Tarefas -->
    <div id="sec-tasks" class="space-y-4">
      <div class="flex flex-wrap gap-2">
        <button onclick="filterCat('all')" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-500 text-white">Todas</button>
        <button onclick="filterCat('dormir')" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-600 border">🌙 Antes de Dormir</button>
        <button onclick="filterCat('escola')" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-600 border">📚 Escolares</button>
        <button onclick="filterCat('casa')" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-600 border">🏠 Casa</button>
      </div>

      <div id="tasks-list" class="space-y-2"></div>
    </div>

    <!-- Seção: Loja -->
    <div id="sec-store" class="hidden space-y-4">
      <div id="store-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </div>

  </div>

  <!-- Modal dos Pais -->
  <div id="parent-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 max-w-lg w-full space-y-4 shadow-2xl border-2 border-purple-200">
      <div class="flex justify-between items-center">
        <h3 class="text-xl font-bold text-purple-900 flex items-center gap-2">🔐 Painel de Controle dos Pais</h3>
        <button onclick="closeParentModal()" class="text-slate-400 font-bold hover:text-slate-600 text-xl">✕</button>
      </div>

      <div id="pin-screen" class="space-y-3 text-center py-4">
        <p class="text-sm font-semibold text-slate-600">Digite o PIN de Segurança para Acessar</p>
        <input type="password" id="pin-input" maxlength="4" placeholder="****" class="w-32 text-center text-2xl tracking-widest p-2 border-2 border-purple-300 rounded-xl font-bold text-purple-900 focus:outline-none focus:border-purple-600">
        <div>
          <button onclick="verifyPIN()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-6 py-2 rounded-xl shadow-md transition-all">Entrar</button>
        </div>
        <p class="text-xs text-slate-400">PIN padrão: 1234</p>
      </div>

      <div id="admin-screen" class="hidden space-y-4">
        <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Missões Pendentes de Validação</p>
        <div id="pending-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
        <div class="border-t pt-3 flex justify-end">
          <button onclick="closeParentModal()" class="bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const INITIAL_TASKS = [
      // Antes de dormir
      { id: 'd1', title: 'Arrumei meu quarto e guardei meus pertences', cat: 'dormir', catName: '🌙 Antes de dormir', xp: 20, coins: 5 },
      { id: 'd2', title: 'Separei as roupas para o dia seguinte', cat: 'dormir', catName: '🌙 Antes de dormir', xp: 15, coins: 4 },
      { id: 'd3', title: 'Preparei e conferi minha mochila', cat: 'dormir', catName: '🌙 Antes de dormir', xp: 20, coins: 5 },
      { id: 'd4', title: 'Verifiquei se tenho atividades ou compromissos amanhã', cat: 'dormir', catName: '🌙 Antes de dormir', xp: 15, coins: 4 },
      // Escolares
      { id: 'e1', title: 'Consultei minha agenda', cat: 'escola', catName: '📚 Escolares', xp: 15, coins: 3 },
      { id: 'e2', title: 'Fiz minhas atividades escolares sozinho', cat: 'escola', catName: '📚 Escolares', xp: 30, coins: 10 },
      { id: 'e3', title: 'Pedi ajuda quando realmente precisei', cat: 'escola', catName: '📚 Escolares', xp: 15, coins: 3 },
      { id: 'e4', title: 'Conferi se concluí todas as atividades', cat: 'escola', catName: '📚 Escolares', xp: 20, coins: 5 },
      // Casa
      { id: 'c1', title: 'Arrumei minha cama', cat: 'casa', catName: '🏠 Casa', xp: 15, coins: 4 },
      { id: 'c2', title: 'Guardei minhas roupas', cat: 'casa', catName: '🏠 Casa', xp: 15, coins: 4 },
      { id: 'c3', title: 'Levei meus pratos e copos para a cozinha', cat: 'casa', catName: '🏠 Casa', xp: 10, coins: 3 },
      { id: 'c4', title: 'Cumpri minha tarefa doméstica do dia', cat: 'casa', catName: '🏠 Casa', xp: 25, coins: 8 }
    ];

    const STORE_ITEMS = [
      { id: 'r1', title: '30 min a mais de videogame / tela', cost: 30, icon: '🎮' },
      { id: 'r2', title: 'Escolher o filme da família no fim de semana', cost: 25, icon: '🍿' },
      { id: 'r3', title: 'Dormir 30 min mais tarde no fim de semana', cost: 40, icon: '🌙' },
      { id: 'r4', title: 'Passeio especial escolhido por mim', cost: 60, icon: '🍦' }
    ];

    let db = {
      activeChild: 'flavinho',
      children: {
        flavinho: { name: 'Flavinho', sub: 'Explorador da Autonomia (9 anos)', avatar: '🚀', xp: 0, coins: 0, pending: [], completed: [] },
        carol: { name: 'Carol', sub: 'Mestre Criativa (11 anos)', avatar: '🎸', xp: 0, coins: 0, pending: [], completed: [] }
      }
    };

    // Forçar atualização do localStorage para a nova versão
    localStorage.removeItem('missao_autonomia_v3');
    localStorage.setItem('missao_autonomia_v4', JSON.stringify(db));

    let currentCat = 'all';

    function init() {
      renderProfile();
      renderTasks();
      renderStore();
    }

    function switchChild(childKey) {
      db.activeChild = childKey;
      document.getElementById('btn-flavinho').className = childKey === 'flavinho' ? 'px-4 py-2 rounded-xl font-bold text-sm transition-all bg-amber-500 text-white shadow-md' : 'px-4 py-2 rounded-xl font-bold text-sm transition-all bg-slate-100 text-slate-600 hover:bg-slate-200';
      document.getElementById('btn-carol').className = childKey === 'carol' ? 'px-4 py-2 rounded-xl font-bold text-sm transition-all bg-amber-500 text-white shadow-md' : 'px-4 py-2 rounded-xl font-bold text-sm transition-all bg-slate-100 text-slate-600 hover:bg-slate-200';
      renderProfile();
      renderTasks();
    }

    function renderProfile() {
      const child = db.children[db.activeChild];
      document.getElementById('profile-avatar').innerText = child.avatar;
      document.getElementById('profile-name').innerText = child.name;
      document.getElementById('profile-sub').innerText = child.sub;
      document.getElementById('coins-count').innerText = child.coins;
      
      const level = Math.floor(child.xp / 100) + 1;
      const currentLvlXP = child.xp % 100;
      document.getElementById('level-label').innerText = `Nível ${level}`;
      document.getElementById('xp-text').innerText = `${currentLvlXP} / 100 XP`;
      document.getElementById('xp-bar').style.width = `${currentLvlXP}%`;
    }

    function renderTasks() {
      const child = db.children[db.activeChild];
      const container = document.getElementById('tasks-list');
      container.innerHTML = '';

      const filtered = currentCat === 'all' ? INITIAL_TASKS : INITIAL_TASKS.filter(t => t.cat === currentCat);

      filtered.forEach(task => {
        const isPending = child.pending.includes(task.id);
        const isDone = child.completed.includes(task.id);

        let statusBadge = `<button onclick="submitTask('${task.id}')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs shadow-sm transition-all">Cumprir</button>`;
        if (isPending) statusBadge = `<span class="bg-amber-100 text-amber-700 font-bold px-3 py-1.5 rounded-xl text-xs border border-amber-300">⏳ Aguardando Papai</span>`;
        if (isDone) statusBadge = `<span class="bg-emerald-100 text-emerald-700 font-bold px-3 py-1.5 rounded-xl text-xs border border-emerald-300">✅ Aprovado</span>`;

        container.innerHTML += `
          <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between gap-3">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-100">${task.catName}</span>
              <h4 class="font-bold text-slate-700 text-sm mt-1">${task.title}</h4>
              <div class="text-xs text-slate-400 font-semibold mt-0.5">+${task.xp} XP • 🪙 +${task.coins}</div>
            </div>
            <div>${statusBadge}</div>
          </div>
        `;
      });
    }

    function submitTask(taskId) {
      const child = db.children[db.activeChild];
      if (!child.pending.includes(taskId) && !child.completed.includes(taskId)) {
        child.pending.push(taskId);
        renderTasks();
      }
    }

    function renderStore() {
      const container = document.getElementById('store-list');
      container.innerHTML = '';
      STORE_ITEMS.forEach(item => {
        container.innerHTML += `
          <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="text-3xl">${item.icon}</span>
              <div>
                <h4 class="font-bold text-slate-800 text-sm">${item.title}</h4>
                <div class="text-xs font-bold text-amber-600">🪙 ${item.cost} Moedas</div>
              </div>
            </div>
            <button onclick="buyReward(${item.cost})" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs shadow-sm">Resgatar</button>
          </div>
        `;
      });
    }

    function buyReward(cost) {
      const child = db.children[db.activeChild];
      if (child.coins >= cost) {
        child.coins -= cost;
        confetti({ particleCount: 50, spread: 60 });
        renderProfile();
        alert('Prêmio resgatado com sucesso! Mostre ao papai!');
      } else {
        alert('Moedas insuficientes! Cumpra mais tarefas para acumular.');
      }
    }

    function filterCat(cat) {
      currentCat = cat;
      renderTasks();
    }

    function switchTab(tab) {
      if (tab === 'tasks') {
        document.getElementById('sec-tasks').classList.remove('hidden');
        document.getElementById('sec-store').classList.add('hidden');
      } else {
        document.getElementById('sec-tasks').classList.add('hidden');
        document.getElementById('sec-store').classList.remove('hidden');
      }
    }

    function openParentModal() {
      document.getElementById('parent-modal').classList.remove('hidden');
      document.getElementById('parent-modal').classList.add('flex');
    }
    function closeParentModal() {
      document.getElementById('parent-modal').classList.add('hidden');
      document.getElementById('parent-modal').classList.remove('flex');
    }

    function verifyPIN() {
      const pin = document.getElementById('pin-input').value;
      if (pin === '1234') {
        document.getElementById('pin-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.remove('hidden');
        renderPendingAdmin();
      } else {
        alert('PIN Incorreto!');
      }
    }

    function renderPendingAdmin() {
      const container = document.getElementById('pending-list');
      container.innerHTML = '';
      let count = 0;

      ['flavinho', 'carol'].forEach(cKey => {
        const child = db.children[cKey];
        child.pending.forEach(taskId => {
          count++;
          const task = INITIAL_TASKS.find(t => t.id === taskId);
          container.innerHTML += `
            <div class="bg-purple-50 p-3 rounded-xl border border-purple-100 flex items-center justify-between text-xs">
              <div>
                <span class="font-bold text-purple-900">${child.name}</span>: ${task.title}
                <div class="text-[10px] text-slate-500">+${task.xp} XP | +${task.coins} moedas</div>
              </div>
              <div class="flex gap-1">
                <button onclick="approveTask('${cKey}', '${task.id}')" class="bg-emerald-600 text-white font-bold px-2.5 py-1 rounded-lg">Aprovar</button>
                <button onclick="rejectTask('${cKey}', '${task.id}')" class="bg-rose-500 text-white font-bold px-2.5 py-1 rounded-lg">Recusar</button>
              </div>
            </div>
          `;
        });
      });

      if (count === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Nenhuma tarefa aguardando aprovação.</p>`;
      }
    }

    function approveTask(cKey, taskId) {
      const child = db.children[cKey];
      const task = INITIAL_TASKS.find(t => t.id === taskId);
      child.pending = child.pending.filter(id => id !== taskId);
      child.completed.push(taskId);
      child.xp += task.xp;
      child.coins += task.coins;

      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      renderProfile();
      renderTasks();
      renderPendingAdmin();
    }

    function rejectTask(cKey, taskId) {
      const child = db.children[cKey];
      child.pending = child.pending.filter(id => id !== taskId);
      renderTasks();
      renderPendingAdmin();
    }

    init();
  </script>
</body>
</html>
